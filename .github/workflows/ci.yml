name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: rustfmt, clippy
      - name: Библиотеки X11 и Wayland для оконной сборки
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxi-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-default-features
      - name: Сборка панели под aarch64
        run: |
          host=$(rustc -vV | sed -n 's/host: //p')
          export PATH="$(rustc --print sysroot)/lib/rustlib/${host}/bin:${PATH}"
          cargo build --release --target aarch64-unknown-linux-musl --no-default-features
